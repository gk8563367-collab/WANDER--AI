<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050d">
<title>Wander AI</title>
<style>
:root{--bg:#07050d;--panel:#0d0818;--bar:#181030;--ink:#ece8f7;--muted:#8d82ab;--line:#2a1f48;--p1:#8b5cf6;--p2:#c026d3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 50% -10%,#2a1257,transparent 60%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
#side{position:fixed;inset:0 auto 0 0;width:280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 12px;transform:translateX(-100%);transition:transform .25s;z-index:20}
#side.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:15;display:none}
#scrim.show{display:block}
.logo{font-weight:700;font-size:20px;letter-spacing:2px;padding:4px 8px 14px;background:linear-gradient(90deg,#c4b5fd,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bar);font-weight:600;margin-top:8px}
#nc{border-color:var(--p1);background:linear-gradient(135deg,rgba(139,92,246,.25),rgba(192,38,211,.18));margin:0}
.lbl{color:var(--muted);font-size:13px;margin:16px 8px 6px}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.it{display:flex;align-items:center;border-radius:10px}
.it.act,.it:hover{background:var(--bar)}
.it .t{flex:1;text-align:left;padding:9px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.it .x{color:var(--muted);padding:6px 10px}
.none{color:var(--muted);font-size:14px;padding:6px 10px}
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:rgba(13,8,24,.7)}
#menu{border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px}
header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:1px}
#chat{flex:1;overflow-y:auto;padding:16px 14px}
.wrap{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg{overflow-wrap:anywhere}
.user{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:85%;white-space:pre-wrap}
.bot{align-self:flex-start;width:100%}
.mdb>:first-child{margin-top:0}
.mdb p{margin:0 0 12px}
.mdb h1,.mdb h2,.mdb h3,.mdb h4{margin:16px 0 8px;line-height:1.3;font-size:18px}
.mdb ul,.mdb ol{margin:0 0 12px;padding-left:22px}
.mdb hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.mdb code{background:var(--bar);padding:2px 6px;border-radius:6px;font:14px ui-monospace,Menlo,Consolas,monospace}
.code{background:#0a0613;border-radius:12px;margin:0 0 12px;overflow:hidden;border:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;padding:6px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code pre code{background:none;padding:0;font-size:13.5px}
.tw{overflow-x:auto;margin:0 0 12px}
table{border-collapse:collapse;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--bar)}
.spk{font-size:16px;opacity:.7;padding:4px 8px;border-radius:8px}
.spk.on{background:var(--p2);opacity:1}
.hero{text-align:center;margin:9vh auto 0;max-width:480px}
.orb{width:120px;height:120px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9d5ff,#8b5cf6 45%,#3b0764 80%);box-shadow:0 0 60px 10px rgba(139,92,246,.55),0 0 120px 30px rgba(192,38,211,.25);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.hero h2{font-size:28px;margin:0 0 6px}
.hero p{color:var(--muted);margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--bar);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.chip:hover{border-color:var(--p1)}
form{position:relative;max-width:740px;width:100%;margin:0 auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--bar);border:1px solid var(--line);border-radius:26px;padding:8px}
.box:focus-within{border-color:var(--p1)}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;max-height:140px;padding:6px 4px}
.rb{width:36px;height:36px;border-radius:50%;flex:none}
#plus,#mic{border:1px solid var(--line)}
#plus{font-size:22px}
#mic.on{background:var(--p2);border-color:var(--p2)}
#send{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:18px}
#send:disabled{opacity:.4}
.gen{max-width:100%;border-radius:14px;display:block;margin:0 0 8px;border:1px solid var(--line)}
.dl{color:#c4b5fd}
#pmenu{position:absolute;left:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;min-width:210px;z-index:10}
#pmenu.show{display:block}
#pmenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
#pmenu button:hover{background:var(--bar)}
.tag{display:none;margin:0 0 8px 4px;align-items:center;gap:8px;width:fit-content;border:1px solid var(--p1);border-radius:999px;padding:4px 8px 4px 12px;font-size:14px;background:var(--bar)}
.tag.show{display:flex}
#attach img{width:36px;height:36px;object-fit:cover;border-radius:8px}
#libm{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
#libm.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h2{margin:0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--bar);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tile img{width:100%;display:block;aspect-ratio:1;object-fit:cover}
.tb{display:flex;align-items:center;padding:6px 8px;font-size:13px}
.tb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--muted)}
.tb a{color:var(--ink);text-decoration:none;padding:2px 6px;font-size:15px}
.tb button{padding:2px 6px;font-size:15px}
.empty{color:var(--muted);padding:10px}
:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
@media (min-width:900px){#side{transform:none}#menu{display:none}main{margin-left:280px}#scrim{display:none!important}}
</style>
</head>
<body>
<div id="scrim"></div>
<aside id="side">
  <div class="logo">WANDER AI</div>
  <button id="nc" class="sb" type="button">+ New chat</button>
  <div class="lbl">Your chats</div>
  <div id="list"></div>
  <button id="libb" class="sb" type="button">🖼 Library</button>
</aside>
<main>
  <header><button id="menu" type="button" aria-label="Menu">☰</button><h1>Wander AI</h1></header>
  <div id="chat"><div class="wrap" id="wrap"></div></div>
  <form id="f">
    <div id="pmenu"><button id="mcam" type="button">📷 Camera</button><button id="mpho" type="button">🖼 Photos</button><button id="mimg" type="button">✨ Create image</button><button id="mlang" type="button">🌐 Voice: English</button></div>
    <div id="attach" class="tag"><img id="athumb" alt=""><span>Photo attached</span><button id="ax" type="button" aria-label="Remove photo">✕</button></div>
    <div id="imgchip" class="tag"><span>✨ Create image</span><button id="chipx" type="button" aria-label="Remove">✕</button></div>
    <div class="box"><button id="plus" class="rb" type="button" aria-label="Add">+</button><textarea id="q" rows="1" placeholder="Message Wander AI"></textarea><button id="mic" class="rb" type="button" aria-label="Voice">🎙</button><button id="send" class="rb" type="submit" aria-label="Send">↑</button></div>
  </form>
</main>
<div id="libm"><div class="sheet"><div class="sh"><h2>Your library</h2><button id="libx" type="button" aria-label="Close">✕</button></div><div id="libg" class="grid"></div></div></div>
<input type="file" id="fcam" accept="image/*" capture="environment" hidden>
<input type="file" id="fpho" accept="image/*" hidden>
<script>
const SYS={role:"system",content:"You are Wander AI, a friendly, helpful assistant. Keep answers clear and simple. Use Markdown: short paragraphs, bullet lists, bold for key points, and code blocks for code."};
const $=id=>document.getElementById(id);
const chat=$("chat"),wrap=$("wrap"),q=$("q"),send=$("send"),side=$("side"),scrim=$("scrim"),list=$("list");
let chats=[],cur=null,imgMode=false,attach=null,rec=null,db=null,voiceLang="en-IN";
try{voiceLang=localStorage.getItem("wander_vlang")||"en-IN"}catch(e){}
try{chats=JSON.parse(localStorage.getItem("wander_chats")||"[]")}catch(e){chats=[]}
function save(){try{localStorage.setItem("wander_chats",JSON.stringify(chats,(k,v)=>k==="src"?undefined:v))}catch(e){}}
const h=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function openDB(){return new Promise(res=>{try{const r=indexedDB.open("wander",1);r.onupgradeneeded=()=>r.result.createObjectStore("lib",{keyPath:"id"});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function dbPut(o){return new Promise(res=>{if(!db)return res();try{const t=db.transaction("lib","readwrite");t.objectStore("lib").put(o);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
function dbAll(){return new Promise(res=>{if(!db)return res([]);try{const r=db.transaction("lib").objectStore("lib").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])}catch(e){res([])}})}
function dbGet(id){return new Promise(res=>{if(!db)return res(null);try{const r=db.transaction("lib").objectStore("lib").get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})}
function dbDel(id){return new Promise(res=>{if(!db)return res();try{const t=db.transaction("lib","readwrite");t.objectStore("lib").delete(id);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}

function md(src){
  const blocks=[];
  src=src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{
    blocks.push('<div class="code"><div class="ch"><span>'+(l||"code")+'</span><button class="cp" type="button">Copy</button></div><pre><code>'+h(c.replace(/\n$/,""))+'</code></pre></div>');
    return "\u0000"+(blocks.length-1)+"\u0000";
  });
  const inl=s=>h(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  const out=[];let lst=null,tbl=[];
  const closeList=()=>{if(lst){out.push("</"+lst+">");lst=null}};
  const flushTbl=()=>{
    if(!tbl.length)return;
    const rows=tbl.filter(r=>!/^\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
    let t='<div class="tw"><table>';
    rows.forEach((r,i)=>{t+="<tr>"+r.map(c=>(i==0?"<th>":"<td>")+inl(c)+(i==0?"</th>":"</td>")).join("")+"</tr>"});
    out.push(t+"</table></div>");tbl=[];
  };
  for(const line of src.split("\n")){
    let m;
    if(/^\s*\|/.test(line)){closeList();tbl.push(line.trim());continue}
    flushTbl();
    if(/^\u0000\d+\u0000$/.test(line.trim())){closeList();out.push(line.trim())}
    else if(m=line.match(/^(#{1,6})\s+(.*)/)){closeList();const n=Math.min(m[1].length,4);out.push("<h"+n+">"+inl(m[2])+"</h"+n+">")}
    else if(m=line.match(/^\s*[-*•]\s+(.*)/)){if(lst!=="ul"){closeList();out.push("<ul>");lst="ul"}out.push("<li>"+inl(m[1])+"</li>")}
    else if(m=line.match(/^\s*\d+[.)]\s+(.*)/)){if(lst!=="ol"){closeList();out.push("<ol>");lst="ol"}out.push("<li>"+inl(m[1])+"</li>")}
    else if(/^\s*-{3,}\s*$/.test(line)){closeList();out.push("<hr>")}
    else if(line.trim()===""){closeList()}
    else{closeList();out.push("<p>"+inl(line)+"</p>")}
  }
  closeList();flushTbl();
  return out.join("").replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]);
}
function botHtml(t){return '<div class="mdb">'+md(t)+'</div><button class="spk" type="button" aria-label="Read aloud">🔊</button>'}
function imgBlock(m){
  if(!m.src)return m.lib?"<p>Loading image…</p>":"<p>🖼 Image not saved after you left this chat.</p>";
  return '<img class="gen" alt="Generated image" src="'+m.src+'"><p><a class="dl" download="wander-ai.jpg" href="'+m.src+'">Download</a></p>';
}
function userHtml(m){
  return (m.photo?(m.src?'<img class="gen" alt="Your photo" style="max-width:220px" src="'+m.src+'">':"<p>📷 Photo (not saved)</p>"):"")+h(m.content);
}
function addUser(m){if(m.photo)addMsg(userHtml(m),"user",true);else addMsg(m.content,"user")}
function apiMessages(){
  const msgs=cur.messages.filter(m=>!m.img);
  let last=-1;msgs.forEach((m,i)=>{if(m.photo&&m.src)last=i});
  return [SYS].concat(msgs.map((m,i)=>{
    if(m.photo&&i===last)return{role:"user",content:[{type:"text",text:m.content},{type:"image_url",image_url:{url:m.src}}]};
    if(m.photo)return{role:"user",content:"[The user shared a photo] "+m.content};
    return{role:m.role,content:m.content};
  }));
}
function clearAttach(){attach=null;$("attach").classList.remove("show");$("athumb").removeAttribute("src")}
function loadPhoto(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const sc=Math.min(1,1024/Math.max(im.width,im.height));
    const w=Math.round(im.width*sc),ht=Math.round(im.height*sc);
    const c=document.createElement("canvas");c.width=w;c.height=ht;c.getContext("2d").drawImage(im,0,0,w,ht);
    attach=c.toDataURL("image/jpeg",0.82);$("athumb").src=attach;$("attach").classList.add("show");
  };im.src=rd.result};
  rd.readAsDataURL(file);
}
function speak(t,btn){
  const ss=window.speechSynthesis;if(!ss)return;
  if(btn&&btn.classList.contains("on")){ss.cancel();btn.classList.remove("on");return}
  ss.cancel();document.querySelectorAll(".spk.on").forEach(b=>b.classList.remove("on"));
  const p=t.replace(/[*#`_>|]/g,"").slice(0,1500);
  const u=new SpeechSynthesisUtterance(p);u.lang=voiceLang;
  u.onend=u.onerror=()=>{if(btn)btn.classList.remove("on")};
  if(btn)btn.classList.add("on");
  ss.speak(u);
}
async function openLib(){
  $("libm").classList.add("show");openSide(false);
  const g=$("libg");g.innerHTML="";
  const items=(await dbAll()).sort((a,b)=>b.time-a.time);
  if(!items.length){g.innerHTML='<div class="empty">No images yet. Tap + and choose Create image.</div>';return}
  items.forEach(o=>{
    const t=document.createElement("div");t.className="tile";
    const im=document.createElement("img");im.src=o.src;im.alt=o.prompt;im.loading="lazy";
    const tb=document.createElement("div");tb.className="tb";
    const sp=document.createElement("span");sp.textContent=o.prompt;
    const a=document.createElement("a");a.href=o.src;a.download="wander-ai.jpg";a.textContent="⬇";
    const d=document.createElement("button");d.type="button";d.textContent="✕";d.setAttribute("aria-label","Delete image");
    d.onclick=async()=>{await dbDel(o.id);t.remove()};
    tb.append(sp,a,d);t.append(im,tb);g.appendChild(t);
  });
}
function openSide(o){side.classList.toggle("open",o);scrim.classList.toggle("show",o)}
$("menu").onclick=()=>openSide(true);
scrim.onclick=()=>openSide(false);
function addMsg(t,c,html){const d=document.createElement("div");d.className="msg "+c;if(html)d.innerHTML=t;else d.textContent=t;wrap.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function hero(){
  wrap.innerHTML='<div class="hero"><div class="orb"></div><h2>Wander without limits</h2><p>Ask anything. I will help you explore it.</p><div class="chips"><button class="chip" type="button">Explain something simply</button><button class="chip" type="button">Help me write code</button><button class="chip" type="button">Plan my day</button></div></div>';
}
function renderList(){
  list.innerHTML="";
  if(!chats.length){list.innerHTML='<div class="none">No chats yet</div>';return}
  chats.slice().sort((a,b)=>b.updated-a.updated).forEach(c=>{
    const row=document.createElement("div");row.className="it"+(cur&&cur.id===c.id?" act":"");
    const t=document.createElement("button");t.className="t";t.type="button";t.textContent=c.title;
    t.onclick=()=>{cur=c;renderChat();renderList();openSide(false)};
    const x=document.createElement("button");x.className="x";x.type="button";x.textContent="✕";x.setAttribute("aria-label","Delete chat");
    x.onclick=()=>{chats=chats.filter(k=>k.id!==c.id);if(cur&&cur.id===c.id)cur=null;save();renderChat();renderList()};
    row.appendChild(t);row.appendChild(x);list.appendChild(row);
  });
}
function renderChat(){
  wrap.innerHTML="";
  if(!cur||!cur.messages.length){hero();return}
  cur.messages.forEach(m=>{
    if(m.role==="user")addUser(m);
    else if(m.img){
      const d=addMsg(imgBlock(m),"bot",true);
      if(!m.src&&m.lib)dbGet(m.lib).then(o=>{if(o){m.src=o.src;d.innerHTML=imgBlock(m)}else d.innerHTML="<p>🖼 This image was deleted from your library.</p>"});
    }else addMsg(botHtml(m.content),"bot",true);
  });
  chat.scrollTop=chat.scrollHeight;
}
$("nc").onclick=()=>{cur=null;renderChat();renderList();openSide(false)};
wrap.addEventListener("click",e=>{
  const c=e.target.classList;
  if(c.contains("cp")){
    const code=e.target.closest(".code").querySelector("code").textContent;
    navigator.clipboard.writeText(code).then(()=>{e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1500)});
  }
  if(c.contains("chip")){q.value=e.target.textContent;$("f").requestSubmit()}
  if(c.contains("spk")){speak(e.target.closest(".msg").querySelector(".mdb").textContent,e.target)}
});
function setImg(on){imgMode=on;$("imgchip").classList.toggle("show",on);q.placeholder=on?"Describe the image you want (photo optional)":"Message Wander AI";$("pmenu").classList.remove("show")}
$("plus").onclick=e=>{e.stopPropagation();$("pmenu").classList.toggle("show")};
$("mimg").onclick=()=>{setImg(true);q.focus()};
$("chipx").onclick=()=>setImg(false);
function langLabel(){$("mlang").textContent="🌐 Voice: "+(voiceLang==="ta-IN"?"Tamil":"English")}
$("mlang").onclick=()=>{voiceLang=voiceLang==="ta-IN"?"en-IN":"ta-IN";try{localStorage.setItem("wander_vlang",voiceLang)}catch(e){}langLabel()};
langLabel();
$("mcam").onclick=()=>{$("pmenu").classList.remove("show");$("fcam").click()};
$("mpho").onclick=()=>{$("pmenu").classList.remove("show");$("fpho").click()};
$("fcam").onchange=e=>{loadPhoto(e.target.files[0]);e.target.value=""};
$("fpho").onchange=e=>{loadPhoto(e.target.files[0]);e.target.value=""};
$("ax").onclick=clearAttach;
$("libb").onclick=openLib;
$("libx").onclick=()=>$("libm").classList.remove("show");
$("libm").onclick=e=>{if(e.target===$("libm"))$("libm").classList.remove("show")};
document.addEventListener("click",e=>{if(!e.target.closest("#pmenu"))$("pmenu").classList.remove("show")});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=()=>{
  if(!SR){alert("Voice input is not supported in this browser. Please try Chrome.");return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=voiceLang;rec.interimResults=true;rec.continuous=false;
  let got="";
  rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;got=t;q.value=t;q.dispatchEvent(new Event("input"))};
  rec.onerror=()=>{};
  rec.onend=()=>{rec=null;$("mic").classList.remove("on");if(got.trim())$("f").requestSubmit()};
  rec.start();$("mic").classList.add("on");
};
q.addEventListener("input",()=>{q.style.height="auto";q.style.height=q.scrollHeight+"px"});
q.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>700){e.preventDefault();$("f").requestSubmit()}});

$("f").onsubmit=async ev=>{
  ev.preventDefault();
  let text=q.value.trim();
  if(!text&&attach)text=imgMode?"Create an artistic image inspired by this photo":"What is in this photo?";
  if(!text||send.disabled)return;
  q.value="";q.style.height="auto";
  if(!cur){cur={id:Date.now().toString(36),title:text.slice(0,40),messages:[],updated:Date.now()};chats.push(cur);wrap.innerHTML=""}
  const photo=attach||null;
  const um={role:"user",content:text,img:imgMode,photo:!!photo};
  if(photo)um.src=photo;
  cur.messages.push(um);cur.updated=Date.now();
  clearAttach();addUser(um);renderList();
  const out=addMsg(imgMode?"Creating image… this can take up to 30 seconds":"…","bot");send.disabled=true;
  try{
    if(imgMode){
      const r=await fetch("/api/image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,photo:photo})});
      const data=await r.json();if(!r.ok)throw new Error(data.error&&data.error.message||"Request failed");
      const id="i"+Date.now().toString(36);
      await dbPut({id:id,prompt:text,src:data.image,time:Date.now()});
      const m={role:"assistant",content:text,img:true,lib:id,src:data.image};
      cur.messages.push(m);cur.updated=Date.now();out.innerHTML=imgBlock(m);
    }else{
      const msgs=apiMessages();
      const sentPhoto=msgs.some(m=>Array.isArray(m.content));
      const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs})});
      const data=await r.json();if(!r.ok)throw new Error(data.error&&data.error.message||"Request failed");
      const reply=data.choices[0].message.content||"(no answer)";
      out.innerHTML=botHtml(reply);cur.messages.push({role:"assistant",content:reply});cur.updated=Date.now();
      if(sentPhoto&&!/qwen/i.test(data.model||""))out.innerHTML+="<p>⚠ Photo reading is not active. Please update server.js on GitHub.</p>";
    }
  }catch(err){out.textContent=/limit/i.test(err.message)?err.message:"Error: "+err.message;cur.messages.pop()}
  setImg(false);save();renderList();send.disabled=false;chat.scrollTop=chat.scrollHeight;
};
renderList();openDB().then(renderChat);
</script>
</body>
