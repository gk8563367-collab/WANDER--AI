<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wander AI</title>
<style>
:root{--bg:#212121;--bar:#2f2f2f;--ink:#ececec;--muted:#9b9b9b;--line:#3a3a3a;--code:#171717}
@media (prefers-color-scheme:light){:root{--bg:#fff;--bar:#f4f4f4;--ink:#0d0d0d;--muted:#6b6b6b;--line:#e5e5e5;--code:#f0f0f0}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:600;margin:0}
.hb button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 14px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg{overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--bar);padding:10px 16px;border-radius:20px;max-width:85%;white-space:pre-wrap}
.bot{align-self:flex-start;max-width:100%;width:100%}
.bot>*:first-child{margin-top:0}
.bot p{margin:0 0 12px}
.bot h1,.bot h2,.bot h3,.bot h4{margin:18px 0 8px;line-height:1.3}
.bot h1{font-size:22px}.bot h2{font-size:19px}.bot h3,.bot h4{font-size:17px}
.bot ul,.bot ol{margin:0 0 12px;padding-left:22px}
.bot li{margin:4px 0}
.bot hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.bot code{background:var(--bar);padding:2px 6px;border-radius:6px;font:14px ui-monospace,Menlo,Consolas,monospace}
.code{background:var(--code);border-radius:12px;margin:0 0 12px;overflow:hidden;border:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.cp{background:none;border:0;color:var(--ink);font-size:13px;cursor:pointer}
.code pre{margin:0;padding:12px;overflow-x:auto}
.code pre code{background:none;padding:0;font-size:13.5px;white-space:pre}
.tw{overflow-x:auto;margin:0 0 12px}
table{border-collapse:collapse;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:var(--bar)}
.hero{margin:22vh auto 0;text-align:center;font-size:26px;font-weight:600}
form{max-width:720px;width:100%;margin:0 auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--bar);border-radius:26px;padding:8px 8px 8px 18px}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;max-height:140px;padding:6px 0}
#send{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px;cursor:pointer}
#send:disabled{opacity:.35}
</style>
</head>
<body>
<header>
  <h1>Wander AI</h1>
  <div class="hb"><button id="new" type="button">New chat</button></div>
</header>
<div id="chat"><div class="wrap" id="wrap"><div class="hero" id="hero">What can I help with?</div></div></div>
<form id="f">
  <div class="box"><textarea id="q" rows="1" placeholder="Message Wander AI"></textarea><button id="send" type="submit" aria-label="Send">↑</button></div>
</form>
<script>
const SYS={role:"system",content:"You are Wander AI, a friendly, helpful assistant. Keep answers clear and simple. Use Markdown: short paragraphs, bullet lists, bold for key points, and code blocks for code."};
let history=[SYS];
const chat=document.getElementById("chat"),wrap=document.getElementById("wrap"),q=document.getElementById("q"),send=document.getElementById("send");

function md(src){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const blocks=[];
  src=src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{
    blocks.push('<div class="code"><div class="ch"><span>'+(l||"code")+'</span><button class="cp" type="button">Copy</button></div><pre><code>'+esc(c.replace(/\n$/,""))+'</code></pre></div>');
    return "\u0000"+(blocks.length-1)+"\u0000";
  });
  const inl=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  const out=[];let list=null,tbl=[];
  const closeList=()=>{if(list){out.push("</"+list+">");list=null}};
  const flushTbl=()=>{
    if(!tbl.length)return;
    const rows=tbl.filter(r=>!/^\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
    let h='<div class="tw"><table>';
    rows.forEach((r,i)=>{h+="<tr>"+r.map(c=>(i==0?"<th>":"<td>")+inl(c)+(i==0?"</th>":"</td>")).join("")+"</tr>"});
    out.push(h+"</table></div>");tbl=[];
  };
  for(const line of src.split("\n")){
    let m;
    if(/^\s*\|/.test(line)){closeList();tbl.push(line.trim());continue}
    flushTbl();
    if(/^\u0000\d+\u0000$/.test(line.trim())){closeList();out.push(line.trim())}
    else if(m=line.match(/^(#{1,6})\s+(.*)/)){closeList();const n=Math.min(m[1].length,4);out.push("<h"+n+">"+inl(m[2])+"</h"+n+">")}
    else if(m=line.match(/^\s*[-*•]\s+(.*)/)){if(list!=="ul"){closeList();out.push("<ul>");list="ul"}out.push("<li>"+inl(m[1])+"</li>")}
    else if(m=line.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){closeList();out.push("<ol>");list="ol"}out.push("<li>"+inl(m[1])+"</li>")}
    else if(/^\s*-{3,}\s*$/.test(line)){closeList();out.push("<hr>")}
    else if(line.trim()===""){closeList()}
    else{closeList();out.push("<p>"+inl(line)+"</p>")}
  }
  closeList();flushTbl();
  return out.join("").replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]);
}

function add(t,c){const h=document.getElementById("hero");if(h)h.remove();const d=document.createElement("div");d.className="msg "+c;d.textContent=t;wrap.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
document.getElementById("new").onclick=()=>{history=[SYS];wrap.innerHTML='<div class="hero" id="hero">What can I help with?</div>'};
wrap.addEventListener("click",e=>{
  if(e.target.classList.contains("cp")){
    const code=e.target.closest(".code").querySelector("code").textContent;
    navigator.clipboard.writeText(code).then(()=>{e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1500)});
  }
});
q.addEventListener("input",()=>{q.style.height="auto";q.style.height=q.scrollHeight+"px"});
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault();const text=q.value.trim();if(!text)return;
  q.value="";q.style.height="auto";add(text,"user");history.push({role:"user",content:text});
  const out=add("…","bot");send.disabled=true;
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const data=await r.json();if(!r.ok)throw new Error(data.error&&data.error.message||"Request failed");
    const reply=data.choices[0].message.content;out.innerHTML=md(reply);history.push({role:"assistant",content:reply});
  }catch(err){out.textContent="Error: "+err.message;history.pop()}
  send.disabled=false;chat.scrollTop=chat.scrollHeight;
};
</script>
</body>
</html>
