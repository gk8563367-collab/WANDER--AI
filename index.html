<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wander AI</title>
<style>
:root{--bg:#212121;--bar:#2f2f2f;--ink:#ececec;--muted:#9b9b9b;--line:#3a3a3a}
@media (prefers-color-scheme:light){:root{--bg:#fff;--bar:#f4f4f4;--ink:#0d0d0d;--muted:#6b6b6b;--line:#e5e5e5}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
h1{font-size:17px;font-weight:600;margin:0}
.hb button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 14px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--bar);padding:10px 16px;border-radius:20px;max-width:85%}
.bot{align-self:flex-start;max-width:100%}
.hero{margin:22vh auto 0;text-align:center;font-size:26px;font-weight:600}
form{max-width:720px;width:100%;margin:0 auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--bar);border-radius:26px;padding:8px 8px 8px 18px}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;max-height:140px;padding:6px 0}
#send{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px;cursor:pointer}
#send:disabled{opacity:.35}
</style>
</head>
<body>
<header>
  <h1>Wander AI</h1>
  <div class="hb"><button id="new" type="button">New chat</button></div>
</header>
<div id="chat"><div class="wrap" id="wrap"><div class="hero" id="hero">What can I help with?</div></div></div>
<form id="f">
  <div class="box"><textarea id="q" rows="1" placeholder="Message Wander AI"></textarea><button id="send" type="submit" aria-label="Send">↑</button></div>
</form>
<script>
const SYS={role:"system",content:"You are Wander AI, a friendly, helpful assistant. Keep answers clear and simple."};
let history=[SYS];
const chat=document.getElementById("chat"),wrap=document.getElementById("wrap"),q=document.getElementById("q"),send=document.getElementById("send");
function add(t,c){const h=document.getElementById("hero");if(h)h.remove();const d=document.createElement("div");d.className="msg "+c;d.textContent=t;wrap.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
document.getElementById("new").onclick=()=>{history=[SYS];wrap.innerHTML='<div class="hero" id="hero">What can I help with?</div>'};
q.addEventListener("input",()=>{q.style.height="auto";q.style.height=q.scrollHeight+"px"});
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault();const text=q.value.trim();if(!text)return;
  q.value="";q.style.height="auto";add(text,"user");history.push({role:"user",content:text});
  const out=add("…","bot");send.disabled=true;
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const data=await r.json();if(!r.ok)throw new Error(data.error&&data.error.message||"Request failed");
    const reply=data.choices[0].message.content;out.textContent=reply;history.push({role:"assistant",content:reply});
  }catch(err){out.textContent="Error: "+err.message;history.pop()}
  send.disabled=false;chat.scrollTop=chat.scrollHeight;
};
</script>
</body>
</html>
